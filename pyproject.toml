[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifephybench"
version = "0.0.1"
description = "Decision-making under endogenous persistent physical degradation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Anonymous Authors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
analysis = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tensorboard>=2.21",
]
rl = [
  "gymnasium==1.3.0",
  "torch>=2.4",
  "stable-baselines3>=2.4",
  "sb3-contrib>=2.4",
]
mujoco = [
  "gymnasium[mujoco]==1.3.0",
  "mujoco==3.11.0",
  "numpy<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
