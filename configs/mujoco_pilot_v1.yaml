protocol_version: 1
purpose: phenomenon_and_shortcut_pilot_not_final_comparison

environment:
  id: Pusher-v5
  simulator: mujoco
  simulator_version: 3.11.0
  gymnasium_version: 1.3.0
  episode_steps: 100
  episodes_per_lifetime: 50

factors:
  persistence: [episode_physics_reset, persistent_lifetime]
  cause: [exogenous_clock, endogenous_action]
  observability: [hidden_health, visible_health]

degradation:
  mechanism: actuator_gain
  minimum_efficiency: 0.20
  wear_exponent: 2.0
  pilot_wear_rates: [0.0, 0.00005, 0.0001, 0.0002]
  exogenous_dose_per_step: 0.25

pilot_controllers:
  - zero_action
  - random_uniform
  - scripted_low_dose
  - scripted_high_dose

pilot_seeds: [1000, 1001, 1002, 1003, 1004]

go_no_go:
  require_runtime_physics_direction_test: true
  require_worker_isolation_test: true
  reject_if_time_only_predicts_health_as_well_as_action_history: true
  reject_if_endogenous_and_exogenous_conditions_are_indistinguishable: true
  reject_if_persistent_and_episode_reset_conditions_are_indistinguishable: true

